[package]
name = "linked-data"
description = "Linked-Data dateset serialization/deserialization traits"
categories = ["encoding", "web-programming"]
keywords = ["semantic-web", "linked-data", "rdf", "serialization"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[workspace.package]
authors = ["Spruce Systems, Inc."]
license = "MIT/Apache-2.0"
repository = "https://github.com/spruceid/linked-data-rs"
edition = "2021"
rust-version = "1.71.1"
version = "0.1.2"

[features]
default = ["indexmap"]
derive = ["linked-data-derive"]
indexmap = ["dep:indexmap"]

[dependencies]
rdf-types.workspace = true

# Derive macro.
linked-data-derive = { workspace = true, optional = true }

# Support for `indexmap`.
indexmap = { version = "2.10.0", optional = true }

[[example]]
name = "derive"
required-features = ["derive"]

[workspace]
members = ["derive"]

resolver = "2"

[workspace.dependencies]
linked-data-derive = { version = "0.1.0", path = "derive" }
rdf-types.path = "/home/timothee/Projets/rdf/rdf-types/"
