[workspace.package]
authors = ["Spruce Systems, Inc."]
license = "MIT/Apache-2.0"
repository = "https://github.com/spruceid/linked-data-rs"
edition = "2024"
rust-version = "1.87.0"
version = "0.1.2"

[workspace]
members = ["derive"]

[workspace.dependencies]
linked-data-derive = { version = "0.1.0", path = "derive" } # Keep the version in sync
rdf-syntax = "2.0"

[package]
name = "linked-data"
description = "Linked-Data dateset serialization/deserialization traits"
categories = ["encoding", "web-programming"]
keywords = ["semantic-web", "linked-data", "rdf", "serialization"]
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
derive = ["linked-data-derive"]
indexmap = ["dep:indexmap"]
btree-indexmap = ["dep:btree-indexmap"]

[dependencies]
rdf-syntax.workspace = true
thiserror = "2.0.17"
xsd-types = "0.12"

# Derive macro.
linked-data-derive = { workspace = true, optional = true }

# Support for `indexmap`.
indexmap = { version = "2.10.0", optional = true }

# Support for `btree-indexmap`.
btree-indexmap = { version = "1.4", optional = true }

[dev-dependencies]
nquads-syntax = "0.21"
linked-data = { path = ".", features = ["derive"] }